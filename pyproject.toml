[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-mjx"
authors = [
    {name = "Talmo Pereira", email = "talmo@salk.edu"}]
description="TBD"
requires-python = ">=3.11"
keywords = ["TBD"]
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"]
dependencies = [
    "numpy==2.1.3",
    "tqdm",
    "matplotlib==3.10.0",
    "pandas==3.0.3",
    "mujoco==3.11.0",
    "mujoco-mjx==3.11.0",
    "ipykernel",
    "hydra-core==1.3.2",
    "omegaconf",
    "imageio[ffmpeg]==2.37.0",
    "h5py==3.12.1",
    "mediapy==1.2.2",
    "ndx_pose==0.1.1",
    "pynwb",
    "scipy",
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "jaxtyping>=0.2.34",
    "beartype",
    "jaxls @ git+https://github.com/brentyi/jaxls.git",
    "jaxlie>=1.5.0",
]
    dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
version = {attr = "stac_mjx.version.__version__"}
readme = {file = ["README.md"], content-type="text/markdown"}

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.10.2 ; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]==0.10.2 ; sys_platform == 'linux'"]
notebooks = ["nwbwidgets"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-watch",
    "ruff>=0.11",
    "twine",
    "build",
    ]

[project.urls]
Homepage = "https://github.com/talmolab/stac-mjx"
Repository = "https://github.com/talmolab/stac-mjx"

[project.scripts]
stac-mjx = "stac_mjx.cli:main"

[tool.setuptools.packages.find]
include = ["stac_mjx*"]

[tool.uv]
no-sources-package = ["mujoco", "mujoco-mjx"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # calls in defaults are used for initializers
    "B905",    # zip without strict is common in JAX code
    "RUF059",  # unused unpacked values are common in numerical code
]

[tool.ruff.lint.isort]
known-first-party = ["stac_mjx"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping array shapes are not Python forward references.
"stac_mjx/compute_stac.py" = ["F722"]
"stac_mjx/main.py" = ["F722"]
"stac_mjx/stac.py" = ["F722"]
"stac_mjx/stac_core.py" = ["F722"]
"stac_mjx/utils.py" = ["F722"]
"tests/conftest.py" = ["F401"]  # imports register shared pytest fixtures
"tests/test_cli.py" = ["E402"]  # optional dependency stub precedes CLI imports

[tool.coverage.run]
source = ["stac_mjx"]

[tool.pytest.ini_options]
addopts = "--cov stac_mjx --cov-report=lcov:lcov.info --cov-report=term"
