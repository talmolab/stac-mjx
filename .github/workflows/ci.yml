name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "stac_mjx/**"
      - "tests/**"
      - "run_stac.py"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "stac_mjx/**"
      - "tests/**"
      - "run_stac.py"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.toml

      - name: Run Ruff format check
        run: uvx 'ruff>=0.11' format --check stac_mjx/ tests/ run_stac.py

      - name: Run Ruff lint
        run: uvx 'ruff>=0.11' check stac_mjx/ tests/ run_stac.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.toml

      - name: Install deps
        run: |
          uv venv --python 3.12
          uv pip install ".[dev]"

      - name: Pytest
        run: uv run --no-project pytest --cov=stac_mjx --cov-report=xml --durations=-1 -W ignore::PendingDeprecationWarning tests/

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Smoke test
        run: uv run --no-project python run_stac.py stac=stac_synth_data model=synth_data
