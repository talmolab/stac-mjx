name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "stac_mjx/**"
      - "tests/**"
      - "run_stac.py"
      - "configs/**"
      - "data/**"
      - "models/**"
      - "notebooks/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "stac_mjx/**"
      - "tests/**"
      - "run_stac.py"
      - "configs/**"
      - "data/**"
      - "models/**"
      - "notebooks/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.toml

      - name: Run Ruff format check
        run: uvx 'ruff>=0.11' format --check stac_mjx/ tests/ notebooks/ run_stac.py

      - name: Run Ruff lint
        run: uvx 'ruff>=0.11' check stac_mjx/ tests/ notebooks/ run_stac.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.toml

      - name: Install deps
        run: |
          uv venv --python 3.12
          uv pip install ".[dev]"

      - name: Pytest
        run: uv run --no-project pytest --cov=stac_mjx --cov-report=xml --durations=-1 -W ignore::PendingDeprecationWarning tests/

      - name: Real-data CPU smoke test
        timeout-minutes: 10
        env:
          JAX_PLATFORMS: cpu
          # Avoid compiling the full rodent solver for this tiny integration check.
          JAX_DISABLE_JIT: "true"
          JAX_ENABLE_COMPILATION_CACHE: "false"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: uv run --no-project pytest -o addopts='' -q -s tests/smoke.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
