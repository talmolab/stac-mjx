MJCF_PATH: "/mnt/vast/niyo/stac-mjx/models/mouse_forelimb_right_janelia_arm_hand_v24_stac.xml"

FTOL: 1.0e-04
ROOT_FTOL: 1.0e-05
LIMB_FTOL: 1.0e-06
N_ITERS: 6

# v24 is a different rig (full-skeleton Blender export via
# janelia_model/v24/postprocess_xml.py, arm/hand only reused here -- see
# build_v24_stac_xml.py), NOT a descendant of v17-v22's simplified arm+hand
# XMLs. No joystick body exists in this model at all, so js_base/js_ball are
# dropped entirely (per Eric: v24 IK covers shoulder/arm/wrist/digits only;
# joystick is coming back in a later version). 17 keypoints, same digit
# scheme as v21/v22 (dx_k = knuckle/MCP, dx_m = mid/PIP, dx_t = fingertip;
# digit 1/thumb has no mid point).
KP_NAMES:
  - Shoulder
  - Elbow
  - Wrist
  - D1_K
  - D1_T
  - D2_K
  - D2_M
  - D2_T
  - D3_K
  - D3_M
  - D3_T
  - D4_K
  - D4_M
  - D4_T
  - D5_K
  - D5_M
  - D5_T

KEYPOINT_MODEL_PAIRS:
  # v24 body names carry an explicit "_right" suffix (humerus_right,
  # ulna_right) not present in v17-v22 (humerus, ulna). Wrist maps to
  # N_L_C_right -- v24's single rigid body for the fused proximal carpal
  # complex (Navicular/Lunate/Centrale), the same anatomical role "wrist"
  # played in the older rigs.
  Shoulder: humerus_right
  Elbow: ulna_right
  Wrist: N_L_C_right
  # dx_k = knuckle/MCP joint = origin of the Phalanx_hand_1_x_right body
  D1_K: Phalanx_hand_1_1_right
  D2_K: Phalanx_hand_1_2_right
  D3_K: Phalanx_hand_1_3_right
  D4_K: Phalanx_hand_1_4_right
  D5_K: Phalanx_hand_1_5_right
  # dx_m = mid/PIP joint = origin of the Phalanx_hand_2_x_right body (x=2..5;
  # digit 1/thumb has no mid point)
  D2_M: Phalanx_hand_2_2_right
  D3_M: Phalanx_hand_2_3_right
  D4_M: Phalanx_hand_2_4_right
  D5_M: Phalanx_hand_2_5_right
  # dx_t = fingertip: terminal phalanx body (3rd segment for x=2..5, 2nd for
  # x=1/thumb, which has no 3rd segment) -- not at the body origin, needs the
  # nonzero KEYPOINT_INITIAL_OFFSETS below, refined by STAC's fit_offsets.
  D1_T: Phalanx_hand_2_1_right
  D2_T: Phalanx_hand_3_2_right
  D3_T: Phalanx_hand_3_3_right
  D4_T: Phalanx_hand_3_4_right
  D5_T: Phalanx_hand_3_5_right

KEYPOINT_INITIAL_OFFSETS:
  Shoulder: 0. 0. 0.
  Elbow: 0. 0. 0.
  Wrist: 0. 0. 0.
  D1_K: 0. 0. 0.
  D2_K: 0. 0. 0.
  D3_K: 0. 0. 0.
  D4_K: 0. 0. 0.
  D5_K: 0. 0. 0.
  D2_M: 0. 0. 0.
  D3_M: 0. 0. 0.
  D4_M: 0. 0. 0.
  D5_M: 0. 0. 0.
  # Carried over verbatim from v21/v22 -- same rough initial guesses along
  # local +Y, refined by STAC's fit_offsets during offset optimization.
  # Whether v24's Phalanx-body local frames share the same axis convention
  # as v21/v22's is unverified (v24 is a fresh Blender export, not a v22
  # derivative); this is a starting guess for the smoke test, not an
  # assumption to trust blind -- check per-keypoint marker fit error after
  # fitting for any D*_T outlier that would flag a bad initial offset.
  D1_T: 0. 0.00066 0.
  D2_T: 0. 0.00127 0.
  D3_T: 0. 0.00146 0.
  D4_T: 0. 0.00141 0.
  D5_T: 0. 0.00098 0.

ROOT_OPTIMIZATION_KEYPOINT: Wrist

TRUNK_OPTIMIZATION_KEYPOINTS:
  - "Shoulder"
  - "Elbow"
  - "Wrist"

KEYPOINT_COLOR_PAIRS:
  Shoulder: 1 0 0 1
  Elbow:    1 0.6 0 1
  Wrist:    1 1 0 1
  D1_K: 0.9 0.2 0.9 1
  D1_T: 0.9 0.2 0.9 1
  D2_K: 0.2 0.9 0.2 1
  D2_M: 0.2 0.9 0.2 1
  D2_T: 0.2 0.9 0.2 1
  D3_K: 0.2 0.6 0.9 1
  D3_M: 0.2 0.6 0.9 1
  D3_T: 0.2 0.6 0.9 1
  D4_K: 0.9 0.6 0.2 1
  D4_M: 0.9 0.6 0.2 1
  D4_T: 0.9 0.6 0.2 1
  D5_K: 0.6 0.2 0.9 1
  D5_M: 0.6 0.2 0.9 1
  D5_T: 0.6 0.2 0.9 1

SCALE_FACTOR: 1.0
MOCAP_SCALE_FACTOR: 1.0

# tip sites have nontrivial initial-offset guesses -- regularize toward
# those starting guesses during offset_optimization
SITES_TO_REGULARIZE:
  - D1_T
  - D2_T
  - D3_T
  - D4_T
  - D5_T

RENDER_FPS: 25
N_SAMPLE_FRAMES: 50
M_REG_COEF: 0
