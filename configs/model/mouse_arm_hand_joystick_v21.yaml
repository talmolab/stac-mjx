MJCF_PATH: "/mnt/vast/niyo/stac-mjx/models/mouse_forelimb_right_janelia_arm_hand_v21.xml"

FTOL: 1.0e-04
ROOT_FTOL: 1.0e-05
LIMB_FTOL: 1.0e-06
N_ITERS: 6

# 19 keypoints, matching the js_luc3d_hand merged skeleton order:
# shoulder, elbow, Wrist, d1_k, d1_t, d2_k, d2_m, d2_t, d3_k, d3_m, d3_t,
# d4_k, d4_m, d4_t, d5_k, d5_m, d5_t, js_base, js_ball
# (names below don't have to match the raw mocap h5's node names literally --
# stac_mjx/io.py::load_mocap just needs KP_NAMES consistent with the order
# register_v21_mocap.py writes into each trial's "tracks" array.)
KP_NAMES:
  - Shoulder
  - Elbow
  - Wrist
  - D1_K
  - D1_T
  - D2_K
  - D2_M
  - D2_T
  - D3_K
  - D3_M
  - D3_T
  - D4_K
  - D4_M
  - D4_T
  - D5_K
  - D5_M
  - D5_T
  - js_base
  - js_ball

KEYPOINT_MODEL_PAIRS:
  Shoulder: humerus
  Elbow: ulna
  Wrist: wrist
  # dx_k = knuckle/MCP joint = origin of the Phalanx_hand_1_x_right body
  D1_K: Phalanx_hand_1_1_right
  D2_K: Phalanx_hand_1_2_right
  D3_K: Phalanx_hand_1_3_right
  D4_K: Phalanx_hand_1_4_right
  D5_K: Phalanx_hand_1_5_right
  # dx_m = mid/PIP joint = origin of the Phalanx_hand_2_x_right body (x=2..5;
  # digit 1/thumb has no mid point)
  D2_M: Phalanx_hand_2_2_right
  D3_M: Phalanx_hand_2_3_right
  D4_M: Phalanx_hand_2_4_right
  D5_M: Phalanx_hand_2_5_right
  # dx_t = fingertip: terminal phalanx body (3rd segment for x=2..5, 2nd for
  # x=1/thumb, which has no 3rd segment) -- not at the body origin, needs the
  # nonzero KEYPOINT_INITIAL_OFFSETS below, refined by STAC's fit_offsets.
  D1_T: Phalanx_hand_2_1_right
  D2_T: Phalanx_hand_3_2_right
  D3_T: Phalanx_hand_3_3_right
  D4_T: Phalanx_hand_3_4_right
  D5_T: Phalanx_hand_3_5_right
  # joystick: js_base = shaft/ball junction, js_ball = center of the ball,
  # both on the "joystick" body (the shaft+ball body, child of joystick_base)
  js_base: joystick
  js_ball: joystick

KEYPOINT_INITIAL_OFFSETS:
  Shoulder: 0. 0. 0.
  Elbow: 0. 0. 0.
  Wrist: 0. 0. 0.
  D1_K: 0. 0. 0.
  D2_K: 0. 0. 0.
  D3_K: 0. 0. 0.
  D4_K: 0. 0. 0.
  D5_K: 0. 0. 0.
  D2_M: 0. 0. 0.
  D3_M: 0. 0. 0.
  D4_M: 0. 0. 0.
  D5_M: 0. 0. 0.
  # rough initial guesses along local +Y (the rig's consistent bone-length
  # axis), magnitude = the terminal segment's own parent-offset length (a
  # same-order-of-magnitude proxy for that bone's own length) -- STAC's
  # fit_offsets refines these, exactly like v18's KnuckleC/L guesses.
  D1_T: 0. 0.00066 0.
  D2_T: 0. 0.00127 0.
  D3_T: 0. 0.00146 0.
  D4_T: 0. 0.00141 0.
  D5_T: 0. 0.00098 0.
  # joystick offsets, in the "joystick" body's own local (tilted) frame --
  # measured from static_joystick_labels_withbottom.v001.slp via
  # compute_joystick_geometry.py, not guessed from the shaft geom's own size
  # (see build_v21_xml.py's JOYSTICK_BODY comment for the full derivation).
  # js_base = top of shaft (bottom->base = 0.014363m). js_ball = ball center
  # (base->ball = 0.001822m further up) = 0.014363+0.001822 = 0.016184.
  js_base: 0. 0. 0.014363
  js_ball: 0. 0. 0.016184

ROOT_OPTIMIZATION_KEYPOINT: Wrist

TRUNK_OPTIMIZATION_KEYPOINTS:
  - "Shoulder"
  - "Elbow"
  - "Wrist"

KEYPOINT_COLOR_PAIRS:
  Shoulder: 1 0 0 1
  Elbow:    1 0.6 0 1
  Wrist:    1 1 0 1
  D1_K: 0.9 0.2 0.9 1
  D1_T: 0.9 0.2 0.9 1
  D2_K: 0.2 0.9 0.2 1
  D2_M: 0.2 0.9 0.2 1
  D2_T: 0.2 0.9 0.2 1
  D3_K: 0.2 0.6 0.9 1
  D3_M: 0.2 0.6 0.9 1
  D3_T: 0.2 0.6 0.9 1
  D4_K: 0.9 0.6 0.2 1
  D4_M: 0.9 0.6 0.2 1
  D4_T: 0.9 0.6 0.2 1
  D5_K: 0.6 0.2 0.9 1
  D5_M: 0.6 0.2 0.9 1
  D5_T: 0.6 0.2 0.9 1
  js_base: 0 1 1 1
  js_ball: 0 0 1 1

SCALE_FACTOR: 1.0
MOCAP_SCALE_FACTOR: 1.0

# tip sites + joystick sites have nontrivial initial-offset guesses --
# regularize toward those starting guesses during offset_optimization
SITES_TO_REGULARIZE:
  - D1_T
  - D2_T
  - D3_T
  - D4_T
  - D5_T
  - js_base
  - js_ball

RENDER_FPS: 25
N_SAMPLE_FRAMES: 50
M_REG_COEF: 0
